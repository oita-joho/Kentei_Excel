<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>全商 情報処理 Excel採点アプリ</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>全商 情報処理 Excel採点アプリ</h1>
      <p>
        生徒のExcelファイルを読み込み、指定セルや数式を確認して採点します。
      </p>
    </header>

    <main>
      <section class="card">
        <h2>1. Excelファイルを選択</h2>

        <input
          type="file"
          id="excelFiles"
          accept=".xlsx,.xlsm,.xls"
          multiple
        />

        <p class="note">
          複数のExcelファイルをまとめて選択できます。
        </p>
      </section>

      <section class="card">
        <h2>2. 採点開始</h2>

        <button id="gradeBtn">
          採点する
        </button>

        <button id="csvBtn" disabled>
          結果CSVを保存
        </button>
      </section>

      <section class="card">
        <h2>3. 採点結果</h2>

        <div id="summary">
          まだ採点していません。
        </div>

        <table id="resultTable">
          <thead>
            <tr>
              <th>ファイル名</th>
              <th>得点</th>
              <th>満点</th>
              <th>詳細</th>
            </tr>
          </thead>
          <tbody id="resultBody">
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Excelを読み込むためのライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- 自分で作る動きのファイル -->
  <script src="app.js"></script>
</body>
</html>
